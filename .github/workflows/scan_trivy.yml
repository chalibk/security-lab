name: Trivy Security Scan for NGINX

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: nginx
  IMAGE_TAG: latest

jobs:
  trivy-scan:
    name: Scan NGINX image with Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set scan timestamp
        run: echo "SCAN_TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)" >> $GITHUB_ENV

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          output: trivy-report.txt

      - name: Pull image and record immutable digest
        run: |
          docker pull ${IMAGE_NAME}:${IMAGE_TAG}

          IMAGE_REF=$(docker image inspect \
            --format='{{index .RepoDigests 0}}' \
            ${IMAGE_NAME}:${IMAGE_TAG})

          echo "IMAGE_REF=${IMAGE_REF}" >> $GITHUB_ENV

          mkdir -p security-lab/Trivy_Automation

          {
            echo "Image Tag: ${IMAGE_NAME}:${IMAGE_TAG}"
            echo "Resolved Digest: ${IMAGE_REF}"
            echo "Scan Timestamp: ${SCAN_TIMESTAMP}"
          } > security-lab/Trivy_Automation/metadata-${SCAN_TIMESTAMP}.txt

      - name: Download Trivy Database
        run: trivy image --download-db-only

      - name: Run Trivy JSON Scan
        run: |
          trivy image \
            --scanners vuln \
            --vuln-type os,library \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --output security-lab/Trivy_Automation/scan-results-${SCAN_TIMESTAMP}.json \
            "${IMAGE_REF}"

      - name: Generate Human Readable Report
        run: |
          trivy image \
            --scanners vuln \
            --vuln-type os,library \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format table \
            --output security-lab/Trivy_Automation/scan-results-${SCAN_TIMESTAMP}.txt \
            "${IMAGE_REF}"

      - name: Security Gate
        run: |
          trivy image \
            --scanners vuln \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "${IMAGE_REF}"

      - name: Workflow Summary
        if: always()
        run: |
          {
            echo "## Trivy Container Security Scan"
            echo ""
            echo "- Image: ${IMAGE_NAME}:${IMAGE_TAG}"
            echo "- Digest: ${IMAGE_REF}"
            echo "- Timestamp: ${SCAN_TIMESTAMP}"
            echo "- Security Gate: HIGH and CRITICAL vulnerabilities"
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-nginx-scan-${{ env.SCAN_TIMESTAMP }}
          path: security-lab/Trivy_Automation
          retention-days: 90