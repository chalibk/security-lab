name: Container Security Pipeline (Trivy & Falco)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  trivy-scan:

    strategy:
      matrix:
        include:
          - image_name: nginx
            image_tag: latest

          - image_name: redis
            image_tag: latest

          - image_name: ubuntu
            image_tag: "22.04"

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Pull Image
        run: |
          docker pull ${{ matrix.image_name }}:${{ matrix.image_tag }}

      - name: Start Timer
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Run Trivy JSON Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image_name }}:${{ matrix.image_tag }}
          format: json
          output: trivy-results.json

      - name: Run Trivy Table Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image_name }}:${{ matrix.image_tag }}
          format: table
          output: trivy-results.txt

      - name: Display Trivy Results
        run: |
          cat trivy-results.txt

      - name: Calculate Scan Time
        run: |
          END_TIME=$(date +%s)

          echo "Scan Time: $((END_TIME-START_TIME)) seconds" > performance.txt

          echo "" >> performance.txt
          echo "CPU INFO" >> performance.txt
          lscpu >> performance.txt

          echo "" >> performance.txt
          echo "MEMORY INFO" >> performance.txt
          free -m >> performance.txt

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image_name }}
          path: |
            trivy-results.json
            trivy-results.txt
            performance.txt

################################################################################

  falco-runtime-test:

    needs: trivy-scan

    strategy:
      matrix:
        include:
          - image_name: nginx
            image_tag: latest
            pod_name: nginx-runtime-test

          - image_name: redis
            image_tag: latest
            pod_name: redis-runtime-test

          - image_name: ubuntu
            image_tag: "22.04"
            pod_name: ubuntu-runtime-test

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Create Kind Cluster
        uses: helm/kind-action@v1
        with:
          version: v0.20.0

      ######################################################################
      # CUSTOM RULES
      ######################################################################

      - name: Create Custom Falco Rules
        run: |
          cat > custom-rules.yaml <<EOF

          customRules:
            custom-rules.yaml: |-

              - rule: Detect Passwd Modification
                desc: Detect passwd modifications
                condition: open_write and fd.name=/etc/passwd
                output: Passwd modification detected
                priority: WARNING

              - rule: Detect Shell Execution
                desc: Detect shell execution
                condition: spawned_process and container and proc.name in (sh,bash,dash)
                output: Shell execution detected
                priority: WARNING

          EOF

      ######################################################################

      - name: Install Falco
        run: |
          helm repo add falcosecurity https://falcosecurity.github.io/charts
          helm repo update

          helm install falco falcosecurity/falco \
            --set driver.kind=modern_ebpf \
            -f custom-rules.yaml \
            --wait

      - name: Wait For Falco
        run: |
          kubectl wait \
            --for=condition=Ready \
            pod \
            -l app.kubernetes.io/name=falco \
            --timeout=180s

      ######################################################################

      - name: Deploy Test Pod
        run: |
          kubectl run ${{ matrix.pod_name }} \
            --image=${{ matrix.image_name }}:${{ matrix.image_tag }} \
            --command -- sleep 3600

          kubectl wait \
            --for=condition=Ready \
            pod/${{ matrix.pod_name }} \
            --timeout=120s

      ######################################################################
      # ATTACK 1
      ######################################################################

      - name: Attack 1 - Read Sensitive File
        continue-on-error: true
        run: |
          kubectl exec ${{ matrix.pod_name }} -- \
            cat /etc/shadow

          sleep 10

      ######################################################################
      # ATTACK 2
      ######################################################################

      - name: Attack 2 - Modify Passwd
        continue-on-error: true
        run: |
          kubectl exec ${{ matrix.pod_name }} -- \
            sh -c "echo test >> /etc/passwd"

          sleep 10

      ######################################################################
      # ATTACK 3
      ######################################################################

      - name: Attack 3 - Execute Shell
        continue-on-error: true
        run: |
          kubectl exec ${{ matrix.pod_name }} -- \
            sh -c "id"

          sleep 10

      ######################################################################
      # BENIGN ACTIVITY
      ######################################################################

      - name: Benign Activity
        continue-on-error: true
        run: |
          kubectl exec ${{ matrix.pod_name }} -- \
            touch /tmp/normal-file.txt

          sleep 10

      ######################################################################
      # LOG COLLECTION
      ######################################################################

      - name: Collect Falco Results
        run: |
          kubectl logs \
            -l app.kubernetes.io/name=falco \
            --tail=3000 > falco.log

          echo "==== FALCO ALERTS ===="
          grep -i "warning\|critical" falco.log || true

          cat falco.log

      - name: Upload Falco Results
        uses: actions/upload-artifact@v4
        with:
          name: falco-${{ matrix.image_name }}
          path: falco.log