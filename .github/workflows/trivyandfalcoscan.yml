name: Container Security Pipeline (Trivy & Falco)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  trivy-scan:

    strategy:
      matrix:
        include:
          - image_name: nginx
            image_tag: latest

          - image_name: redis
            image_tag: latest

          - image_name: ubuntu
            image_tag: "22.04"

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Pull Image
        run: |
          docker pull ${{ matrix.image_name }}:${{ matrix.image_tag }}

      - name: Start Timer
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Run Trivy JSON Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image_name }}:${{ matrix.image_tag }}
          format: json
          output: trivy-results.json

      - name: Run Trivy Table Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image_name }}:${{ matrix.image_tag }}
          format: table
          output: trivy-results.txt

      - name: Show Trivy Results
        run: |
          cat trivy-results.txt

      - name: Calculate Scan Time
        run: |
          END_TIME=$(date +%s)

          echo "Scan Time: $((END_TIME-START_TIME)) seconds" > performance.txt

          echo "" >> performance.txt
          echo "CPU INFO" >> performance.txt
          lscpu >> performance.txt

          echo "" >> performance.txt
          echo "MEMORY INFO" >> performance.txt
          free -m >> performance.txt

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image_name }}
          path: |
            trivy-results.json
            trivy-results.txt
            performance.txt

################################################################################

  falco-runtime-test:

    needs: trivy-scan

    strategy:
      matrix:
        include:
          - image_name: nginx
            image_tag: latest
            pod_name: nginx-runtime-test

          - image_name: redis
            image_tag: latest
            pod_name: redis-runtime-test

          - image_name: ubuntu
            image_tag: "22.04"
            pod_name: ubuntu-runtime-test

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Create Kind Cluster
        uses: helm/kind-action@v1
        with:
          version: v0.20.0

      ####################################################################
      # CUSTOM FALCO RULES
      ####################################################################

      - name: Create Falco Values File
        run: |
          cat > falco-values.yaml <<'EOF'
          driver:
            kind: modern_ebpf

          customRules:
            thesis-rules.yaml: |-

              - rule: Detect Passwd Modification
                desc: Detect writes to passwd
                condition: >
                  evt.type in (open,openat,openat2)
                  and evt.is_open_write=true
                  and fd.name=/etc/passwd
                output: >
                  Passwd modification detected
                  (container=%container.name user=%user.name file=%fd.name)
                priority: WARNING

              - rule: Detect Shell Execution
                desc: Detect shell execution inside container
                condition: >
                  spawned_process
                  and container
                  and proc.name in (sh,bash,dash)
                output: >
                  Shell execution detected
                  (container=%container.name command=%proc.cmdline)
                priority: WARNING
          EOF

      ####################################################################
      # INSTALL FALCO
      ####################################################################

      - name: Install Falco
        run: |
          helm repo add falcosecurity https://falcosecurity.github.io/charts
          helm repo update

          helm install falco falcosecurity/falco \
            -f falco-values.yaml \
            --wait

      - name: Wait For Falco
        run: |
          kubectl wait \
            --for=condition=Ready \
            pod \
            -l app.kubernetes.io/name=falco \
            --timeout=180s

      ####################################################################
      # POD DEPLOYMENT
      ####################################################################

      - name: Deploy Test Pod
        run: |
          kubectl run ${{ matrix.pod_name }} \
            --image=${{ matrix.image_name }}:${{ matrix.image_tag }} \
            --command -- sleep 3600

          kubectl wait \
            --for=condition=Ready \
            pod/${{ matrix.pod_name }} \
            --timeout=120s

      ####################################################################
      # ATTACK 1
      ####################################################################

      - name: Attack 1 - Read Shadow
        continue-on-error: true
        run: |
          kubectl exec ${{ matrix.pod_name }} -- \
            cat /etc/shadow

          sleep 15

      ####################################################################
      # ATTACK 2
      ####################################################################

      - name: Attack 2 - Modify Passwd
        continue-on-error: true
        run: |
          kubectl exec ${{ matrix.pod_name }} -- \
            sh -c "echo thesis-test >> /etc/passwd"

          sleep 15

      ####################################################################
      # ATTACK 3
      ####################################################################

      - name: Attack 3 - Execute Shell
        continue-on-error: true
        run: |
          kubectl exec ${{ matrix.pod_name }} -- \
            sh -c "id"

          sleep 15

      ####################################################################
      # BENIGN ACTIVITY
      ####################################################################

      - name: Benign Activity
        continue-on-error: true
        run: |
          kubectl exec ${{ matrix.pod_name }} -- \
            touch /tmp/normal-file.txt

          sleep 15

      ####################################################################
      # COLLECT ALERTS
      ####################################################################

      - name: Collect Falco Logs
        run: |
          kubectl logs \
            -l app.kubernetes.io/name=falco \
            --tail=5000 > falco.log

          echo "===== DETECTED ALERTS ====="
          grep -Ei "warning|critical|passwd modification|shell execution" falco.log || true

          cat falco.log

      - name: Upload Falco Results
        uses: actions/upload-artifact@v4
        with:
          name: falco-${{ matrix.image_name }}
          path: falco.log