name: Container Security Pipeline (Trivy & Falco)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  trivy-scan:

    strategy:
      matrix:
        include:
          - image_name: nginx
            image_tag: latest

          - image_name: redis
            image_tag: latest

          - image_name: ubuntu
            image_tag: "22.04"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pull Container Image
        run: |
          docker pull ${{ matrix.image_name }}:${{ matrix.image_tag }}

      - name: Collect Performance Information
        run: |
          echo "===== CPU INFO =====" > performance.txt
          lscpu >> performance.txt

          echo "" >> performance.txt
          echo "===== MEMORY INFO =====" >> performance.txt
          free -m >> performance.txt

      - name: Start Scan Timer
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Run Trivy JSON Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image_name }}:${{ matrix.image_tag }}
          format: json
          output: trivy-results.json

      - name: Run Trivy Table Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image_name }}:${{ matrix.image_tag }}
          format: table
          output: trivy-results.txt

      - name: Calculate Scan Time
        run: |
          END_TIME=$(date +%s)
          SCAN_TIME=$((END_TIME-START_TIME))

          echo "" >> performance.txt
          echo "===== SCAN TIME =====" >> performance.txt
          echo "Trivy Scan Time: ${SCAN_TIME} seconds" >> performance.txt

      - name: Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image_name }}:${{ matrix.image_tag }}
          severity: HIGH,CRITICAL
          exit-code: 0

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.image_name }}
          path: |
            trivy-results.json
            trivy-results.txt
            performance.txt

  falco-runtime-test:

    needs: trivy-scan

    strategy:
      matrix:
        include:
          - image_name: nginx
            image_tag: latest
            pod_name: nginx-runtime-test

          - image_name: redis
            image_tag: latest
            pod_name: redis-runtime-test

          - image_name: ubuntu
            image_tag: "22.04"
            pod_name: ubuntu-runtime-test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create KinD Cluster
        uses: helm/kind-action@v1
        with:
          version: v0.20.0

      - name: Verify Cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Install Falco
        run: |
          helm repo add falcosecurity https://falcosecurity.github.io/charts
          helm repo update

          helm install falco falcosecurity/falco \
            --set driver.kind=modern_ebpf \
            --wait

      - name: Wait For Falco
        run: |
          kubectl wait \
            --for=condition=Ready \
            pod \
            -l app.kubernetes.io/name=falco \
            --timeout=180s

      - name: Deploy Test Pod
        run: |
          kubectl run ${{ matrix.pod_name }} \
            --image=${{ matrix.image_name }}:${{ matrix.image_tag }}

          kubectl wait \
            --for=condition=Ready \
            pod/${{ matrix.pod_name }} \
            --timeout=120s

      #################################################################
      # ATTACK 1 - READ SENSITIVE FILE
      #################################################################

      - name: Attack 1 - Read Sensitive File
        run: |
          kubectl exec ${{ matrix.pod_name }} \
            -- sh -c "cat /etc/shadow || true"

          sleep 10

      #################################################################
      # ATTACK 2 - MODIFY SENSITIVE FILE PERMISSIONS
      #################################################################

      - name: Attack 2 - Privilege Change
        run: |
          echo "Before:"
          kubectl exec ${{ matrix.pod_name }} \
            -- sh -c "ls -l /etc/passwd"

          kubectl exec ${{ matrix.pod_name }} \
            -- sh -c "chmod 777 /etc/passwd || true"

          echo "After:"
          kubectl exec ${{ matrix.pod_name }} \
            -- sh -c "ls -l /etc/passwd"

          sleep 10

      #################################################################
      # ATTACK 3 - EXECUTE INTERACTIVE SHELL
      #################################################################

      - name: Attack 3 - Execute Shell
        run: |
          kubectl exec ${{ matrix.pod_name }} \
            -- sh -c "sh -c 'echo shell-executed'"

          sleep 10

      #################################################################
      # BENIGN ACTIVITY
      #################################################################

      - name: Benign Activity
        run: |
          kubectl exec ${{ matrix.pod_name }} \
            -- sh -c "touch /tmp/normal-file.txt"

          sleep 10

      #################################################################
      # COLLECT FALCO LOGS
      #################################################################

      - name: Collect Falco Logs
        run: |
          kubectl logs \
            -l app.kubernetes.io/name=falco \
            --tail=1000 > falco.log

          cat falco.log

      - name: Save Runtime Test Summary
        run: |
          cat << EOF > test-summary.txt
          Image: ${{ matrix.image_name }}:${{ matrix.image_tag }}

          Attack 1:
          Read /etc/shadow

          Attack 2:
          chmod 777 /etc/passwd

          Attack 3:
          Execute shell inside container

          Benign Activity:
          touch /tmp/normal-file.txt
          EOF

      - name: Upload Falco Results
        uses: actions/upload-artifact@v4
        with:
          name: falco-${{ matrix.image_name }}
          path: |
            falco.log
            test-summary.txt

      - name: Workflow Summary
        if: always()
        run: |
          {
            echo "## Container Security Evaluation"
            echo ""
            echo "| Test | Status |"
            echo "|------|--------|"
            echo "| Trivy Scan | Completed |"
            echo "| Read Sensitive File | Executed |"
            echo "| Permission Change | Executed |"
            echo "| Shell Execution | Executed |"
            echo "| Benign Activity | Executed |"
            echo ""
            echo "Image Tested: ${{ matrix.image_name }}:${{ matrix.image_tag }}"
          } >> $GITHUB_STEP_SUMMARY
