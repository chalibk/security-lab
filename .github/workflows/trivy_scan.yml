name: Trivy Security Gate

on:
  workflow_dispatch:

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Pull NGINX Image
        run: |
          docker pull nginx:latest

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nginx:latest
          severity: HIGH,CRITICAL
          exit-code: 1