name: Trivy Scan NGINX

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: nginx
  IMAGE_TAG: latest

jobs:
  trivy-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Timestamp
        run: |
          echo "SCAN_TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)" >> $GITHUB_ENV

      - name: Pull NGINX Image
        run: |
          docker pull ${IMAGE_NAME}:${IMAGE_TAG}

      - name: Run Trivy JSON Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nginx:latest
          format: json
          output: trivy-results.json

      - name: Run Trivy Table Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nginx:latest
          format: table
          output: trivy-results.txt

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-nginx-report
          path: |
            trivy-results.json
            trivy-results.txt

      - name: Enforce Security Gate
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nginx:latest
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Workflow Summary
        if: always()
        run: |
          {
            echo "## Trivy Scan Results"
            echo ""
            echo "- Image: nginx:latest"
            echo "- Security Gate: HIGH, CRITICAL"
            echo "- Reports uploaded as workflow artifacts"
          } >> $GITHUB_STEP_SUMMARY