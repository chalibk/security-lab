
name: Trivy Security Scan for NGINX

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: nginx
  IMAGE_TAG: latest
  TRIVY_VERSION: "0.57.0"

jobs:
  trivy-scan:
    name: Scan NGINX image with Trivy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set scan timestamp
        shell: bash
        run: |
          echo "SCAN_TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"

      - name: Install Trivy
        shell: bash
        run: |
          set -euo pipefail

          TRIVY_VERSION="0.69.3"
          curl -fL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o trivy.tar.gz

          tar -xzf trivy.tar.gz trivy
          sudo install trivy /usr/local/bin/trivy
          trivy --version

      - name: Pull NGINX image and resolve digest
        shell: bash
        run: |
          set -euo pipefail

          docker pull "${IMAGE_NAME}:${IMAGE_TAG}"

          IMAGE_REF="$(docker image inspect \
            --format='{{index .RepoDigests 0}}' \
            "${IMAGE_NAME}:${IMAGE_TAG}")"

          if [[ -z "$IMAGE_REF" || "$IMAGE_REF" != *@sha256:* ]]; then
            echo "ERROR: Could not resolve immutable image digest." >&2
            exit 1
          fi

          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"

          mkdir -p security-lab/Trivy_Automation

          {
            echo "Image: ${IMAGE_NAME}:${IMAGE_TAG}"
            echo "Immutable image reference: ${IMAGE_REF}"
            echo "Scan timestamp UTC: ${SCAN_TIMESTAMP}"
            echo
            trivy --version
          } > "security-lab/Trivy_Automation/metadata-${SCAN_TIMESTAMP}.txt"

          echo "Resolved image: $IMAGE_REF"

      - name: Update Trivy vulnerability database
        shell: bash
        run: |
          set -euo pipefail
          trivy image --download-db-only

      - name: Validate image reference
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${IMAGE_REF:-}" || "$IMAGE_REF" != *@sha256:* ]]; then
            echo "ERROR: IMAGE_REF is empty or invalid." >&2
            exit 1
          fi

          echo "Scanning: $IMAGE_REF"

      - name: Generate JSON vulnerability report
        shell: bash
        run: |
          set -euo pipefail

          trivy image \
            --skip-db-update \
            --scanners vuln \
            --pkg-types os,library \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json \
            --exit-code 0 \
            --output "security-lab/Trivy_Automation/scan-results-${SCAN_TIMESTAMP}.json" \
            "$IMAGE_REF"

      - name: Generate readable vulnerability report
        shell: bash
        run: |
          set -euo pipefail

          trivy image \
            --skip-db-update \
            --scanners vuln \
            --pkg-types os,library \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format table \
            --exit-code 0 \
            --output "security-lab/Trivy_Automation/scan-results-${SCAN_TIMESTAMP}.txt" \
            "$IMAGE_REF"

          cat "security-lab/Trivy_Automation/scan-results-${SCAN_TIMESTAMP}.txt"

      - name: Enforce HIGH/CRITICAL vulnerability gate
        shell: bash
        run: |
          set -euo pipefail

          trivy image \
            --skip-db-update \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            "$IMAGE_REF"

      - name: Add scan details to workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Trivy NGINX Security Scan"
            echo
            echo "- Image: ${IMAGE_NAME}:${IMAGE_TAG}"
            echo "- Image digest: ${IMAGE_REF:-not resolved}"
            echo "- Trivy version: ${TRIVY_VERSION}"
            echo "- Timestamp UTC: ${SCAN_TIMESTAMP}"
            echo "- Policy: fail on HIGH or CRITICAL vulnerabilities"
            echo "- Reports are available in the workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-nginx-scan-${{ env.SCAN_TIMESTAMP }}
          path: security-lab/Trivy_Automation/
          if-no-files-found: warn
          retention-days: 90
