name: Container Security Comparison (Grype & Tracee)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: nginx
  IMAGE_TAG: latest

jobs:
  grype-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Grype CLI
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Run Grype Vulnerability Scan
        run: |
          grype ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o json > grype-results.json
          grype ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} -o table > grype-results.txt
          cat grype-results.txt

      - name: Upload Grype Reports
        uses: actions/upload-artifact@v4
        with:
          name: grype-security-report
          path: |
            grype-results.json
            grype-results.txt

  tracee-runtime-test:
    needs: grype-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up and Run Tracee Runtime Monitor
        run: |
          echo "Pulling container images..."
          docker pull aquasec/tracee:latest
          docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          echo "Starting Tracee in the background..."
          # Fixed: Added --events to explicitly capture file opens and process executions
          docker run -d --name tracee --privileged \
            -v /lib/modules:/lib/modules:ro \
            -v /usr/src:/usr/src:ro \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /etc/os-release:/etc/os-release-host:ro \
            -e LIBBPFGO_OSRELEASE_FILE=/etc/os-release-host \
            aquasec/tracee:latest \
            --output json \
            --events openat,execve > tracee-container.log 2>&1 || true

          # Give Tracee time to initialize eBPF probes
          sleep 10

          echo "Deploying test container..."
          docker run -d --name nginx-runtime-test ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          echo "Simulating a runtime action inside the container..."
          docker exec nginx-runtime-test sh -c "cat /etc/shadow || true"

          # Allow Tracee time to flush captured events
          sleep 5

          echo "Capturing Tracee runtime event logs..."
          docker logs tracee > tracee-results.txt || true
          
          # Filter specifically for shadow or openat events in the workflow log
          echo "Filtering results for shadow file access..."
          grep -i "shadow" tracee-results.txt || echo "No shadow match found in tail, check full artifact."
          tail -n 50 tracee-results.txt