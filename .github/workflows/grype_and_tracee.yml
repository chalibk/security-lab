name: Container Security Comparison (Grype & Tracee)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

###############################################################################
# GRYPE SCAN
###############################################################################

  grype-scan:

    strategy:
      matrix:
        include:
          - image_name: nginx
            image_tag: latest

          - image_name: redis
            image_tag: latest

          - image_name: ubuntu
            image_tag: "22.04"

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pull Image
        run: |
          docker pull ${{ matrix.image_name }}:${{ matrix.image_tag }}

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
          | sudo sh -s -- -b /usr/local/bin

      - name: Start Timer
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Run Grype JSON Scan
        run: |
          grype ${{ matrix.image_name }}:${{ matrix.image_tag }} \
            -o json > grype-results.json

      - name: Run Grype Table Scan
        run: |
          grype ${{ matrix.image_name }}:${{ matrix.image_tag }} \
            -o table > grype-results.txt

      - name: Display Results
        run: |
          cat grype-results.txt

      - name: Count Vulnerabilities
        run: |
          echo "===== GRYPE SUMMARY ====="

          jq '
          [.matches[].vulnerability.severity]
          | group_by(.)
          | map({
              severity: .[0],
              count: length
            })
          ' grype-results.json > grype-summary.json

          cat grype-summary.json

      - name: Calculate Scan Time
        run: |
          END_TIME=$(date +%s)

          echo "Scan Time: $((END_TIME-START_TIME)) seconds" \
            > performance.txt

          echo "" >> performance.txt
          echo "CPU INFORMATION" >> performance.txt
          lscpu >> performance.txt

          echo "" >> performance.txt
          echo "MEMORY INFORMATION" >> performance.txt
          free -m >> performance.txt

      - name: Upload Grype Results
        uses: actions/upload-artifact@v4
        with:
          name: grype-${{ matrix.image_name }}
          path: |
            grype-results.json
            grype-results.txt
            grype-summary.json
            performance.txt

###############################################################################
# TRACEE RUNTIME TESTS
###############################################################################

  tracee-runtime-test:

    needs: grype-scan

    strategy:
      matrix:
        include:
          - image_name: nginx
            image_tag: latest
            container_name: nginx-tracee-test

          - image_name: redis
            image_tag: latest
            container_name: redis-tracee-test

          - image_name: ubuntu
            image_tag: "22.04"
            container_name: ubuntu-tracee-test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      #########################################################################
      # INSTALL TRACEE
      #########################################################################

      - name: Pull Images
        run: |
          docker pull aquasec/tracee:latest
          docker pull ${{ matrix.image_name }}:${{ matrix.image_tag }}

      - name: Start Tracee
        run: |

          docker run -d \
            --name tracee \
            --privileged \
            --pid=host \
            --cgroupns=host \
            -v /etc/os-release:/etc/os-release-host:ro \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /lib/modules:/lib/modules:ro \
            -v /usr/src:/usr/src:ro \
            -e LIBBPFGO_OSRELEASE_FILE=/etc/os-release-host \
            aquasec/tracee:latest \
            --output table

          sleep 20

      #########################################################################
      # TEST CONTAINER
      #########################################################################

      - name: Deploy Test Container
        run: |

          docker run -d \
            --name ${{ matrix.container_name }} \
            ${{ matrix.image_name }}:${{ matrix.image_tag }} \
            sleep 3600

          sleep 10

      #########################################################################
      # ATTACK 1
      #########################################################################

      - name: Attack 1 - Read Shadow File
        continue-on-error: true
        run: |

          docker exec \
            ${{ matrix.container_name }} \
            sh -c "cat /etc/shadow"

          sleep 10

      #########################################################################
      # ATTACK 2
      #########################################################################

      - name: Attack 2 - Modify Passwd
        continue-on-error: true
        run: |

          docker exec \
            ${{ matrix.container_name }} \
            sh -c "echo thesis-test >> /etc/passwd"

          sleep 10

      #########################################################################
      # ATTACK 3
      #########################################################################

      - name: Attack 3 - Execute Shell
        continue-on-error: true
        run: |

          docker exec \
            ${{ matrix.container_name }} \
            sh -c "id"

          sleep 10

      #########################################################################
      # BENIGN ACTIVITY
      #########################################################################

      - name: Benign Activity
        continue-on-error: true
        run: |

          docker exec \
            ${{ matrix.container_name }} \
            touch /tmp/normal-file.txt

          sleep 10

      #########################################################################
      # COLLECT LOGS
      #########################################################################

      - name: Collect Tracee Logs
        run: |

          docker logs tracee > tracee.log 2>&1 || true

          echo "===== SHADOW EVENTS ====="
          grep -i shadow tracee.log || true

          echo "===== PASSWD EVENTS ====="
          grep -i passwd tracee.log || true

          echo "===== EXECVE EVENTS ====="
          grep -i execve tracee.log || true

          tail -n 200 tracee.log

      - name: Upload Tracee Results
        uses: actions/upload-artifact@v4
        with:
          name: tracee-${{ matrix.image_name }}
          path: tracee.log