name: Grype Scan NGINX

on:
  workflow_dispatch:

jobs:
  grype-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Pull NGINX Image
        run: |
          docker pull nginx:latest

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Update Grype Database
        run: |
          grype db update

      - name: Scan NGINX Image
        run: |
          grype nginx:latest -o table > grype-nginx-report.txt
          cat grype-nginx-report.txt

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: grype-nginx-report
          path: grype-nginx-report.txt