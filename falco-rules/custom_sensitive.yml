# falco-rules/custom_sensitive.yaml

- rule: Sensitive File Access - etc shadow
  desc: Detect a process opening /etc/shadow
  condition: >
    open_read and
    fd.name=/etc/shadow
  output: >
    CRITICAL: Process accessed /etc/shadow
    (user=%user.name uid=%user.uid
     proc=%proc.name pid=%proc.pid
     cmdline=%proc.cmdline
     file=%fd.name)
  priority: CRITICAL
  tags: [suspicious, sensitive_file]
